name: Sync Vibe Coding from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily 02:00 UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Sync from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          VIBECODING_FOLDER_ID: ${{ secrets.VIBECODING_FOLDER_ID }}
        run: python .github/scripts/sync_drive.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vibecoding/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "sync: update vibecoding content from Google Drive [skip ci]"
            git push
          )
