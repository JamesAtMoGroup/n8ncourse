<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n8n 自動化課程 | MoGroup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ─────────────────────────────────────── */
    :root {
      --bg:           #07071c;
      --bg-2:         #0d0d26;
      --glass:        rgba(255,255,255,0.04);
      --glass-hover:  rgba(255,255,255,0.07);
      --border:       rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);

      --accent:       #3b82f6;
      --accent-dim:   rgba(59,130,246,0.15);
      --accent-glow:  rgba(59,130,246,0.25);
      --accent-2:     #8b5cf6;

      --text-1:       #e2e8f0;
      --text-2:       #94a3b8;
      --text-3:       #475569;

      --open-bg:      rgba(52,211,153,0.1);
      --open-bdr:     rgba(52,211,153,0.25);
      --open-text:    #34d399;

      --wip-bg:       rgba(251,191,36,0.08);
      --wip-bdr:      rgba(251,191,36,0.2);
      --wip-text:     #fbbf24;
    }

    /* ── Reset ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated orbs ──────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(59,130,246,0.13), transparent 70%);
      top: -250px; left: -150px;
    }
    .orb-2 {
      width: 550px; height: 550px;
      background: radial-gradient(circle, rgba(139,92,246,0.1), transparent 70%);
      bottom: -180px; right: -120px;
      animation-delay: -9s;
    }
    .orb-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(59,130,246,0.07), transparent 70%);
      top: 40%; left: 55%;
      animation-duration: 26s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 25px) scale(1.04); }
    }

    /* ── Nav ────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(7,7,28,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-mark {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
    }

    .logo-text span {
      color: var(--accent);
    }

    .nav-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-3);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
    }

    /* ── Hero ───────────────────────────────────────── */
    .hero {
      position: relative;
      z-index: 1;
      padding: 80px 40px 60px;
      max-width: 960px;
      margin: 0 auto;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 20px;
    }

    .hero-eyebrow::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(0.75); }
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, var(--text-1) 40%, var(--text-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 17px;
      color: var(--text-2);
      line-height: 1.7;
      max-width: 540px;
      margin-bottom: 32px;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-1);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.04em;
    }

    .stat-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* ── Section heading ─────────────────────────────── */
    .section-wrap {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
    }

    .section-count {
      font-size: 12px;
      color: var(--text-3);
    }

    /* ── Course grid ─────────────────────────────────── */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── Course card ─────────────────────────────────── */
    .course-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .course-card:not(.wip):hover {
      border-color: rgba(59,130,246,0.3);
      background: var(--glass-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.1);
    }

    .course-card.wip {
      opacity: 0.6;
      cursor: default;
    }

    /* Top glow line on open cards */
    .course-card:not(.wip)::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent);
    }

    /* Card banner */
    .card-banner {
      height: 80px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 12px 16px;
    }

    .card-banner-bg {
      position: absolute;
      inset: 0;
    }

    .course-card:not(.wip) .card-banner-bg {
      background: linear-gradient(135deg,
        rgba(59,130,246,0.18) 0%,
        rgba(139,92,246,0.12) 100%);
    }

    .course-card.wip .card-banner-bg {
      background: linear-gradient(135deg,
        rgba(255,255,255,0.04) 0%,
        rgba(255,255,255,0.02) 100%);
    }

    .day-badge {
      position: relative;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.25);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .course-card.wip .day-badge {
      color: var(--text-3);
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.08);
    }

    .day-number {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 56px;
      font-weight: 800;
      color: rgba(255,255,255,0.05);
      line-height: 1;
      letter-spacing: -2px;
      user-select: none;
    }

    /* Card body */
    .card-body {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.4;
    }

    .course-card.wip .card-title {
      color: var(--text-2);
    }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 999px;
      padding: 4px 10px;
      width: fit-content;
    }

    .status-badge.open {
      background: var(--open-bg);
      border: 1px solid var(--open-bdr);
      color: var(--open-text);
    }

    .status-badge.wip {
      background: var(--wip-bg);
      border: 1px solid var(--wip-bdr);
      color: var(--wip-text);
    }

    .status-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-badge.open  .status-dot { background: var(--open-text); animation: pulse 2s ease-in-out infinite; }
    .status-badge.wip   .status-dot { background: var(--wip-text); }

    /* Card footer */
    .card-footer {
      padding: 10px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }

    .card-cta {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-cta-arrow {
      font-size: 14px;
      transition: transform 0.15s;
    }

    .course-card:not(.wip):hover .card-cta-arrow {
      transform: translateX(3px);
    }

    .card-cta.disabled {
      color: var(--text-3);
      cursor: default;
    }

    /* ── Footer ─────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 32px 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-3);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 640px) {
      nav { padding: 0 20px; }
      .hero { padding: 48px 20px 40px; }
      .hero h1 { font-size: 32px; letter-spacing: -0.5px; }
      .hero p  { font-size: 15px; }
      .section-wrap { padding: 0 20px 60px; }
      .course-grid { grid-template-columns: 1fr; }
      .stat-divider { display: none; }
    }
  </style>
</head>
<body>

<!-- Background orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Nav -->
<nav>
  <a class="nav-logo" href="#">
    <div class="logo-mark">M</div>
    <span class="logo-text">Mo<span>Group</span></span>
  </a>
  <span class="nav-badge">n8n 自動化課程</span>
</nav>

<!-- Hero -->
<section class="hero">
  <span class="hero-eyebrow">線上課程平台</span>
  <h1>用 n8n 打造<br>你的 AI 自動化系統</h1>
  <p>從零開始，不需要任何程式基礎。跟著每日課程，三週內建出能帶來商業價值的 AI 工作流程。</p>
  <div class="hero-stats">
    <div class="stat">
      <span class="stat-num" id="totalDays">1</span>
      <span class="stat-label">已開放課程</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-num">21</span>
      <span class="stat-label">完整天數</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-num">0</span>
      <span class="stat-label">需要程式基礎</span>
    </div>
  </div>
</section>

<!-- Courses -->
<div class="section-wrap">
  <div class="section-header">
    <h2>所有課程</h2>
    <span class="section-count" id="courseCount">共 21 天</span>
  </div>

  <div class="course-grid" id="courseGrid"></div>
</div>

<!-- Footer -->
<footer>
  © 2026 MoGroup · 課程持續更新中 ·
  <a href="https://n8ndayone.zeabur.app/" target="_blank">n8n Day 1</a>
</footer>

<script>
  const courses = [
    {
      day: 1,
      title: '從零到第一個 AI Agent',
      status: 'open',
      url: 'https://n8ndayone.zeabur.app/'
    },
    { day:  2, title: 'AI Agent 記憶：讓 AI 記住對話', status: 'wip' },
    { day:  3, title: '工作流程的條件判斷與分支',       status: 'wip' },
    { day:  4, title: '連接 Google Sheets 自動記錄',   status: 'wip' },
    { day:  5, title: '傳送 Email 與 Line 通知',       status: 'wip' },
    { day:  6, title: 'Webhook：讓外部服務叫醒你的 Agent', status: 'wip' },
    { day:  7, title: '排程自動化：每天固定時間執行',    status: 'wip' },
    { day:  8, title: '抓取網頁資料（Web Scraping）',   status: 'wip' },
    { day:  9, title: 'AI 摘要：讓 Agent 讀文件',       status: 'wip' },
    { day: 10, title: '串接 Notion 打造知識庫',         status: 'wip' },
    { day: 11, title: '向量資料庫與 RAG 入門',           status: 'wip' },
    { day: 12, title: '讓 AI 搜尋網路即時資訊',          status: 'wip' },
    { day: 13, title: 'AI 圖片生成工作流程',             status: 'wip' },
    { day: 14, title: '多 Agent 協作：拆解複雜任務',     status: 'wip' },
    { day: 15, title: '錯誤處理與工作流程穩定性',         status: 'wip' },
    { day: 16, title: '打造 Line Bot 智慧助理',          status: 'wip' },
    { day: 17, title: '打造 Telegram Bot',              status: 'wip' },
    { day: 18, title: '客服自動化：FAQ 智慧回覆',         status: 'wip' },
    { day: 19, title: '業務自動化：報價與跟進流程',        status: 'wip' },
    { day: 20, title: '部署與分享你的工作流程',            status: 'wip' },
    { day: 21, title: '期末整合：打造你的 AI 助理系統',   status: 'wip' },
  ];

  function renderCourses() {
    const grid = document.getElementById('courseGrid');
    const openCount = courses.filter(c => c.status === 'open').length;

    document.getElementById('totalDays').textContent = openCount;

    grid.innerHTML = courses.map(c => {
      const isOpen = c.status === 'open';
      const tag = isOpen ? 'a' : 'div';
      const href = isOpen ? `href="${c.url}" target="_blank"` : '';
      const wipClass = isOpen ? '' : 'wip';

      return `
        <${tag} class="course-card ${wipClass}" ${href}>
          <div class="card-banner">
            <div class="card-banner-bg"></div>
            <span class="day-badge">Day ${c.day}</span>
            <span class="day-number">${String(c.day).padStart(2,'0')}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${c.title}</div>
            <span class="status-badge ${isOpen ? 'open' : 'wip'}">
              <span class="status-dot"></span>
              ${isOpen ? '開啟' : '更新中'}
            </span>
          </div>
          <div class="card-footer">
            ${isOpen
              ? `<span class="card-cta">進入課程 <span class="card-cta-arrow">→</span></span>`
              : `<span class="card-cta disabled">即將推出</span>`
            }
          </div>
        </${tag}>
      `;
    }).join('');
  }

  renderCourses();
</script>
</body>
</html>
