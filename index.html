<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Learn | n8n 自動化課程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ─────────────────────────────────────── */
    :root {
      --bg:           #0e0918;
      --bg-2:         #1a1624;
      --glass:        rgba(255,255,255,0.04);
      --glass-hover:  rgba(255,255,255,0.07);
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);

      --accent:       #ee4f27;
      --accent-dim:   rgba(238,79,39,0.15);
      --accent-glow:  rgba(238,79,39,0.3);
      --accent-2:     #fd8925;

      --text-1:       #ffffff;
      --text-2:       #c8c4b0;
      --text-3:       #8a859e;

    }

    /* ── Reset ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated orbs ──────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(238,79,39,0.12), transparent 70%);
      top: -250px; left: -150px;
    }
    .orb-2 {
      width: 550px; height: 550px;
      background: radial-gradient(circle, rgba(234,75,113,0.09), transparent 70%);
      bottom: -180px; right: -120px;
      animation-delay: -9s;
    }
    .orb-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(253,137,37,0.07), transparent 70%);
      top: 40%; left: 55%;
      animation-duration: 26s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 25px) scale(1.04); }
    }

    /* ── Nav ────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(14,9,24,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-mark {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
    }

    .logo-text span {
      color: var(--accent);
    }

    .nav-center {
      display: flex;
      gap: 4px;
    }

    .nav-tab {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-3);
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .nav-tab:hover { color: var(--text-2); background: var(--glass); }

    .nav-tab.active {
      color: var(--text-1);
      background: var(--glass);
      border: 1px solid var(--border);
    }

    .nav-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-3);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
    }

    /* ── Hero ───────────────────────────────────────── */
    /* Full-width hero wrapper */
    .hero-wrap {
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* Blurred background image */
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: right center;
      filter: blur(8px);
      opacity: 0.3;
      transform: scale(1.08);
    }

    /* Dark block covering left half (hides the text in image) */
    .hero-bg-cover {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
        #0e0918 0%,
        #0e0918 38%,
        rgba(14,9,24,0.92) 52%,
        rgba(14,9,24,0.5) 68%,
        rgba(14,9,24,0.15) 85%,
        transparent 100%
      );
    }

    /* Top + bottom fade so it blends into page */
    .hero-bg-fade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(14,9,24,0.6) 0%, transparent 25%),
        linear-gradient(to top,    #0e0918 0%,          transparent 30%);
    }

    .hero {
      position: relative;
      z-index: 1;
      padding: 80px 40px 60px;
      max-width: 960px;
      margin: 0 auto;
    }

    .hero-eyebrow { display: none; }

    .hero h1 {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, var(--text-1) 40%, var(--text-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 17px;
      color: var(--text-2);
      line-height: 1.7;
      max-width: 540px;
      margin-bottom: 32px;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-1);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 0.04em;
    }

    /* ── Knowledge filters ───────────────────────── */
    .kn-filters {
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-pill {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-pill:hover {
      color: var(--text-2);
      border-color: rgba(255,255,255,0.16);
    }

    .filter-pill.active {
      background: var(--accent-dim);
      border-color: rgba(238,79,39,0.4);
      color: var(--accent);
      font-weight: 600;
    }

    .filter-pill.tag-pill.active {
      background: rgba(253,137,37,0.12);
      border-color: rgba(253,137,37,0.35);
      color: var(--accent-2);
    }

    .kn-hidden { display: none !important; }

    /* ── Section heading ─────────────────────────────── */
    .section-wrap {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
    }

    .section-count {
      font-size: 12px;
      color: var(--text-3);
    }

    /* ── Course grid ─────────────────────────────────── */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── Course card ─────────────────────────────────── */
    .course-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .course-card:not(.wip):hover {
      border-color: rgba(238,79,39,0.3);
      background: var(--glass-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(238,79,39,0.1);
    }

    .course-card.wip {
      opacity: 0.6;
      cursor: default;
    }

    /* Top glow line on open cards */
    .course-card:not(.wip)::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(238,79,39,0.5), transparent);
    }

    /* Card banner */
    .card-banner {
      height: 80px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 12px 16px;
    }

    .card-banner-bg {
      position: absolute;
      inset: 0;
    }

    .course-card:not(.wip) .card-banner-bg {
      background: linear-gradient(135deg,
        rgba(238,79,39,0.18) 0%,
        rgba(253,137,37,0.10) 100%);
    }

    .course-card.wip .card-banner-bg {
      background: linear-gradient(135deg,
        rgba(255,255,255,0.04) 0%,
        rgba(255,255,255,0.02) 100%);
    }

    .day-badge {
      position: relative;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(238,79,39,0.15);
      border: 1px solid rgba(238,79,39,0.25);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .course-card.wip .day-badge {
      color: var(--text-3);
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.08);
    }

    .day-number {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 56px;
      font-weight: 800;
      color: rgba(255,255,255,0.05);
      line-height: 1;
      letter-spacing: -2px;
      user-select: none;
    }

    /* Card body */
    .card-body {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.4;
    }

    .course-card.wip .card-title {
      color: var(--text-2);
    }

    /* Card footer */
    .card-footer {
      padding: 10px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }

    .card-cta {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-cta-arrow {
      font-size: 14px;
      transition: transform 0.15s;
    }

    .course-card:not(.wip):hover .card-cta-arrow {
      transform: translateX(3px);
    }

    .card-cta.disabled {
      color: var(--text-3);
      cursor: default;
    }

    /* ── Footer ─────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 32px 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-3);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ── Page visibility ────────────────────────────── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Knowledge feed ──────────────────────────────── */
    .kn-wrap {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 40px 80px;
    }

    .kn-header {
      margin-bottom: 32px;
    }

    .kn-header h2 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-1);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .kn-header p {
      font-size: 14px;
      color: var(--text-3);
    }

    .kn-feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .kn-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 26px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .kn-card:hover { border-color: rgba(238,79,39,0.25); }

    .kn-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(238,79,39,0.4), transparent);
    }

    .kn-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .kn-type {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(238,79,39,0.25);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .kn-date {
      font-size: 12px;
      color: var(--text-3);
    }

    .kn-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .kn-body {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.8;
      white-space: pre-wrap;
      max-height: calc(14px * 1.8 * 4);
      overflow: hidden;
      transition: max-height 0.35s ease;
    }

    .kn-body.expanded {
      max-height: 9999px;
    }

    .kn-read-more {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--accent);
      cursor: pointer;
      padding: 6px 0 0;
      display: block;
    }

    .kn-read-more:hover { opacity: 0.75; }

    .kn-section { margin-top: 16px; }
    .kn-section:first-child { margin-top: 0; }

    .kn-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .kn-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(253,137,37,0.1);
      border: 1px solid rgba(253,137,37,0.25);
      color: var(--accent-2);
      cursor: pointer;
      transition: background 0.15s;
    }

    .kn-tag:hover { background: rgba(253,137,37,0.2); }

    .kn-embed {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-2);
    }

    .kn-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .kn-audio {
      width: 100%;
      border-radius: 8px;
      accent-color: var(--accent);
    }

    .kn-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-3);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .kn-wrap { padding: 32px 20px 60px; }
      .kn-title { font-size: 16px; }
      .nav-center { gap: 2px; }
      .nav-tab { font-size: 13px; padding: 6px 10px; }
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 640px) {
      nav { padding: 0 20px; }
      .hero { padding: 48px 20px 40px; }
      .hero h1 { font-size: 32px; letter-spacing: -0.5px; }
      .hero p  { font-size: 15px; }
      .section-wrap { padding: 0 20px 60px; }
      .course-grid { grid-template-columns: 1fr; }
      .stat-divider { display: none; }
    }
  </style>
</head>
<body>

<!-- Background orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Nav -->
<nav>
  <a class="nav-logo" href="#">
    <div class="logo-mark" id="logoMark"></div>
    <span class="logo-text" id="logoText"></span>
  </a>
  <div class="nav-center">
    <button class="nav-tab active" data-page="home" onclick="showPage('home')">我的主頁</button>
    <button class="nav-tab" data-page="knowledge" onclick="showPage('knowledge')">每日知識庫</button>
  </div>
  <span class="nav-badge" id="navBadge"></span>
</nav>

<div id="page-home" class="page active">

<!-- Hero -->
<div class="hero-wrap">
  <!-- Blurred background image -->
  <div class="hero-bg">
    <img src="https://community.n8n.io/uploads/default/original/3X/9/d/9de0ce9dbb14cd0c476c4f1536c87f447c4f0d02.png" alt="" aria-hidden="true" />
    <div class="hero-bg-cover"></div>
    <div class="hero-bg-fade"></div>
  </div>

  <!-- Content -->
  <section class="hero">
    <span class="hero-eyebrow" id="heroEyebrow"></span>
    <h1 id="heroTitle"></h1>
    <p id="heroSubtitle"></p>
    <div class="hero-stats">
      <div class="stat">
        <span class="stat-num" id="totalDays">—</span>
        <span class="stat-label">已開放課程</span>
      </div>
      <div class="stat">
        <span class="stat-num">21</span>
        <span class="stat-label">天</span>
      </div>
      <div class="stat">
        <span class="stat-num">0</span>
        <span class="stat-label">程式碼</span>
      </div>
    </div>
  </section>
</div>

<!-- Courses -->
<div class="section-wrap">
  <div class="section-header">
    <h2>所有課程</h2>
    <span class="section-count" id="courseCount">共 21 天</span>
  </div>

  <div class="course-grid" id="courseGrid"></div>
</div>

</div><!-- /page-home -->

<!-- Knowledge page -->
<div id="page-knowledge" class="page">
  <div class="kn-wrap">
    <div class="kn-header">
      <h2>每日知識庫</h2>
      <p>每天更新的文章、影片與音訊內容</p>
    </div>
    <div class="kn-filters" id="knFilters" style="display:none">
      <div>
        <p class="filter-label">📅 日期</p>
        <div class="filter-pills" id="datePills"></div>
      </div>
      <div>
        <p class="filter-label">🏷️ 標籤</p>
        <div class="filter-pills" id="tagPills"></div>
      </div>
    </div>
    <div class="kn-feed" id="knowledgeFeed">
      <div class="kn-empty">載入中...</div>
    </div>
  </div>
</div><!-- /page-knowledge -->

<!-- Footer -->
<footer>
  <span id="footerText"></span>
</footer>

<script>
  /* ═══════════════════════════════════════════════
     SITE CONFIG — edit this section to customise
     the logo, branding text, and page copy.
  ═══════════════════════════════════════════════ */
  const CONFIG = {
    logoLetter:   'X',
    logoName:     'X <span>Learn</span>',
    navBadge:     'n8n 自動化課程',
    heroEyebrow:  '',
    heroTitle:    '用 n8n 打造<br>你的 AI 自動化系統',
    heroSubtitle: '從零開始，不需要任何程式基礎。跟著每日課程，三週內建出能帶來商業價值的 AI 工作流程。',
    footerText:   '© 2026 X Learn · 課程持續更新中',
  };

  /* Apply config to DOM */
  document.getElementById('logoMark').textContent  = CONFIG.logoLetter;
  document.getElementById('logoText').innerHTML    = CONFIG.logoName;
  document.getElementById('navBadge').textContent  = CONFIG.navBadge;
  document.getElementById('heroEyebrow').textContent = CONFIG.heroEyebrow;
  document.getElementById('heroTitle').innerHTML   = CONFIG.heroTitle;
  document.getElementById('heroSubtitle').textContent = CONFIG.heroSubtitle;
  document.getElementById('footerText').textContent = CONFIG.footerText;

  /* ═══════════════════════════════════════════════
     COURSES — loaded from courses.json
     To add/edit courses, edit courses.json only.
     Fields:
       day    : number
       title  : string
       status : "open" | "wip"
       url    : string (required when status = "open")
  ═══════════════════════════════════════════════ */
  function renderCourses(courses) {
    const grid = document.getElementById('courseGrid');
    const openCount = courses.filter(c => c.status === 'open').length;
    document.getElementById('totalDays').textContent = openCount;

    grid.innerHTML = courses.map(c => {
      const isOpen = c.status === 'open';
      const tag     = isOpen ? 'a' : 'div';
      const href    = isOpen ? `href="${c.url}" target="_blank"` : '';
      const wipClass = isOpen ? '' : 'wip';

      return `
        <${tag} class="course-card ${wipClass}" ${href}>
          <div class="card-banner">
            <div class="card-banner-bg"></div>
            <span class="day-badge">Day ${c.day}</span>
            <span class="day-number">${String(c.day).padStart(2,'0')}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${c.title}</div>
          </div>
          <div class="card-footer">
            ${isOpen
              ? `<span class="card-cta">進入課程 <span class="card-cta-arrow">→</span></span>`
              : `<span class="card-cta disabled">即將推出</span>`
            }
          </div>
        </${tag}>
      `;
    }).join('');
  }

  fetch('courses.json')
    .then(r => r.json())
    .then(renderCourses)
    .catch(() => {
      document.getElementById('courseGrid').innerHTML =
        '<p style="color:var(--text-3);font-size:14px;">無法載入課程資料，請確認 courses.json 存在。</p>';
    });

  /* ═══════════════════════════════════════════════
     PAGE SWITCHER
  ═══════════════════════════════════════════════ */
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('[data-page="' + name + '"]').classList.add('active');
    window.scrollTo(0, 0);
  }

  /* ═══════════════════════════════════════════════
     KNOWLEDGE FEED — loaded from knowledge.json
     Each entry can have ANY combination of:
       date     : "YYYY-MM-DD"
       title    : string
       body     : string  (article text, optional)
       videoUrl : string  (YouTube watch or embed URL, optional)
       audioUrl : string  (direct audio file URL, optional)
  ═══════════════════════════════════════════════ */
  function toEmbed(url) {
    if (!url) return url;
    return url.replace('watch?v=', 'embed/').replace('youtu.be/', 'www.youtube.com/embed/');
  }

  let allPosts = [];
  let activeDate = '全部';
  let activeTags = new Set();

  function renderKnowledge(items) {
    if (!items || items.length === 0) {
      document.getElementById('knowledgeFeed').innerHTML = '<div class="kn-empty">尚無內容，敬請期待。</div>';
      return;
    }
    items.sort((a, b) => new Date(b.date) - new Date(a.date));
    allPosts = items;
    buildFilters(items);
    renderFeed();
  }

  function buildFilters(items) {
    // Dates
    const dates = ['全部', ...new Set(items.map(i => i.date))];
    document.getElementById('datePills').innerHTML = dates.map(d =>
      `<button class="filter-pill ${d === '全部' ? 'active' : ''}" onclick="setDate('${d}')">${d === '全部' ? '全部' : formatDate(d)}</button>`
    ).join('');

    // Tags
    const tags = [...new Set(items.flatMap(i => i.tags || []))].sort();
    const tagEl = document.getElementById('tagPills');
    if (tags.length > 0) {
      tagEl.innerHTML = tags.map(t =>
        `<button class="filter-pill tag-pill" onclick="toggleTag('${t}')" data-tag="${t}">${t}</button>`
      ).join('');
      document.getElementById('knFilters').style.display = 'flex';
    } else {
      // show only date filter if no tags
      document.getElementById('knFilters').style.display = 'flex';
      tagEl.parentElement.style.display = 'none';
    }
  }

  function formatDate(d) {
    const [y, m, day] = d.split('-');
    return `${m}/${day}`;
  }

  function setDate(d) {
    activeDate = d;
    document.querySelectorAll('#datePills .filter-pill').forEach(btn => {
      btn.classList.toggle('active', btn.textContent === (d === '全部' ? '全部' : formatDate(d)));
    });
    renderFeed();
  }

  function toggleTag(tag) {
    if (activeTags.has(tag)) activeTags.delete(tag);
    else activeTags.add(tag);
    document.querySelectorAll('#tagPills .filter-pill').forEach(btn => {
      btn.classList.toggle('active', activeTags.has(btn.dataset.tag));
    });
    renderFeed();
  }

  function renderFeed() {
    const feed = document.getElementById('knowledgeFeed');
    const filtered = allPosts.filter(item => {
      const dateMatch = activeDate === '全部' || item.date === activeDate;
      const tagMatch  = activeTags.size === 0 || (item.tags || []).some(t => activeTags.has(t));
      return dateMatch && tagMatch;
    });

    if (filtered.length === 0) {
      feed.innerHTML = '<div class="kn-empty">沒有符合條件的內容</div>';
      return;
    }

    feed.innerHTML = filtered.map((item, idx) => {
      const badges = [];
      if (item.body)     badges.push('📄 文章');
      if (item.videoUrl) badges.push('🎬 影片');
      if (item.audioUrl) badges.push('🎵 音訊');
      if (badges.length === 0) badges.push('📄 文章');
      const badgeHTML = badges.map(b => `<span class="kn-type">${b}</span>`).join('');

      const tagHTML = (item.tags || []).length
        ? `<div class="kn-tags">${item.tags.map(t => `<span class="kn-tag" onclick="toggleTag('${t}')">${t}</span>`).join('')}</div>`
        : '';

      let sections = '';
      if (item.body) {
        sections += `
          <div class="kn-section">
            <div class="kn-body" id="kn-body-${idx}">${item.body.replace(/\n/g, '<br>')}</div>
            <button class="kn-read-more" id="kn-btn-${idx}" onclick="toggleBody(${idx})">展開全文 ↓</button>
          </div>`;
      }
      if (item.videoUrl) {
        sections += `<div class="kn-section kn-embed"><iframe src="${toEmbed(item.videoUrl)}" allowfullscreen></iframe></div>`;
      }
      if (item.audioUrl) {
        sections += `<div class="kn-section"><audio class="kn-audio" controls><source src="${item.audioUrl}"></audio></div>`;
      }

      return `
        <div class="kn-card">
          <div class="kn-meta">${badgeHTML}<span class="kn-date">${item.date}</span></div>
          <h3 class="kn-title">${item.title}</h3>
          ${tagHTML}
          ${sections}
        </div>`;
    }).join('');

    // Show/hide read-more buttons
    requestAnimationFrame(() => {
      filtered.forEach((item, idx) => {
        if (!item.body) return;
        const el  = document.getElementById('kn-body-' + idx);
        const btn = document.getElementById('kn-btn-' + idx);
        if (el && btn && el.scrollHeight <= el.clientHeight + 2) btn.style.display = 'none';
      });
    });
  }

  function toggleBody(idx) {
    const el  = document.getElementById('kn-body-' + idx);
    const btn = document.getElementById('kn-btn-' + idx);
    const open = el.classList.toggle('expanded');
    btn.textContent = open ? '收起 ↑' : '展開全文 ↓';
  }

  fetch('knowledge.json')
    .then(r => r.json())
    .then(renderKnowledge)
    .catch(() => {
      document.getElementById('knowledgeFeed').innerHTML =
        '<div class="kn-empty">尚無內容，敬請期待。</div>';
    });
</script>
</body>
</html>
